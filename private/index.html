    const label = document.getElementById('unlock-label');
    const toggle = document.getElementById('password-toggle');
    function showError(message) {
      error.textContent = message;
      password.setAttribute('aria-invalid', 'true');
      password.focus();
    }
    toggle.addEventListener('click', () => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      toggle.setAttribute('aria-pressed', String(show));
      toggle.textContent = show ? '隐藏' : '显示';
    });
    password.addEventListener('input', () => {
      error.textContent = '';
      password.removeAttribute('aria-invalid');
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!password.value) { showError('请输入访问密码。'); return; }
      if (!globalThis.crypto?.subtle) { showError('请通过 HTTPS 或本地预览地址打开本页。'); return; }
      button.disabled = true;
      label.textContent = '正在解锁…';
      try {
        const result = await staticrypt.handleDecryptionOfPage(password.value, false);
        if (!result.isSuccessful) { showError('密码不正确，请重试。'); }
      } catch {
        showError('暂时没能解锁，请刷新页面后重试。');
      } finally {
        button.disabled = false;
        label.textContent = '解锁';
      }
    });
  </script>
</body>
</html>
