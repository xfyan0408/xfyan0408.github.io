<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#212121">
  <title>具象内容 | Nanaki</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <div id="header_wrap" class="outer">
    <header class="inner">
      <h1 id="project_title"><a href="../">Nanaki</a></h1>
      <h2 id="project_tagline"></h2>
    </header>
  </div>
  <div id="main_content_wrap" class="outer">
    <main id="main_content" class="inner">
      <p class="back-link"><a href="../">← 返回首页</a></p>
      <h2>具象内容</h2>
      <p>输入密码后查看。</p>
      <form id="password-form" class="password-form" novalidate>
        <label for="password">访问密码</label>
        <div class="password-field">
          <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" spellcheck="false" autocapitalize="none" aria-describedby="password-error" required>
          <button id="password-toggle" class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
        </div>
        <p id="password-error" class="form-error" role="alert" aria-live="polite"></p>
        <button id="unlock-button" class="primary-button" type="submit"><span id="unlock-label">解锁</span></button>
      </form>
      <noscript><p class="form-error">请启用 JavaScript 后再输入密码。</p></noscript>
    </main>
  </div>
  <div id="footer_wrap" class="outer">
    <footer class="inner">
      <p>Published with <a href="https://pages.github.com">GitHub Pages</a></p>
    </footer>
  </div>
  <script>
    // StatiCrypt inserts its encryption engine and encrypted content at build time.
    const staticryptInitiator = /*[|js_staticrypt|]*/0;
    const staticryptConfig = /*[|staticrypt_config|]*/0;
    const staticrypt = staticryptInitiator.init(staticryptConfig, {
      rememberExpirationKey: 'nilhil_expiration',
      rememberPassphraseKey: 'nilhil_passphrase',
      replaceHtmlCallback: null,
      clearLocalStorageCallback: null,
    });
    const form = document.getElementById('password-form');
    const password = document.getElementById('password');
    const error = document.getElementById('password-error');
    const button = document.getElementById('unlock-button');
    const label = document.getElementById('unlock-label');
    const toggle = document.getElementById('password-toggle');
    function showError(message) {
      error.textContent = message;
      password.setAttribute('aria-invalid', 'true');
      password.focus();
    }
    toggle.addEventListener('click', () => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      toggle.setAttribute('aria-pressed', String(show));
      toggle.textContent = show ? '隐藏' : '显示';
    });
    password.addEventListener('input', () => {
      error.textContent = '';
      password.removeAttribute('aria-invalid');
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!password.value) { showError('请输入访问密码。'); return; }
      if (!globalThis.crypto?.subtle) { showError('请通过 HTTPS 或本地预览地址打开本页。'); return; }
      button.disabled = true;
      label.textContent = '正在解锁…';
      try {
        const result = await staticrypt.handleDecryptionOfPage(password.value, false);
        if (!result.isSuccessful) { showError('密码不正确，请重试。'); }
      } catch {
        showError('暂时没能解锁，请刷新页面后重试。');
      } finally {
        button.disabled = false;
        label.textContent = '解锁';
      }
    });
  </script>
</body>
</html>
